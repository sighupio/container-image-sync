# Container image builds derived from Chainguard-maintained forks of archived
# or otherwise unmaintained upstream projects. Distinct from `modules/ingress/`
# (and similar domain modules) which mirror upstream images verbatim: the
# entries here BUILD images from source on every sync, so the lifecycle and
# cadence are different.
#
# See README.md (sibling) for the catalog (which forks, why we adopted them,
# registry mapping, bump procedure).
#
# ORDER MATTERS within the file: where one entry's BASE_IMAGE references
# another entry's destination tag, the producer entry must appear first.
# The sync script processes entries sequentially.
#
# KNOWN LIMITATION (to fix in the future): build.git_source schema accepts a
# single `ref`, while `tag` can be a list. As a result we can build only one
# version of the fork per entry: supporting multiple versions today requires
# duplicating the entry (one per ref). When we need to publish more than one
# supported line of a fork in parallel, extend the schema so git_source,
# tag, and BASE_IMAGE can be paired across multiple versions in one entry.

images:
  - name: nginx base image v1.15.16 [Chainguard fork]
    source: ingress-nginx-chainguard-nginx-v1.15.16
    multi-arch: true
    build:
      git_source:
        repo: https://github.com/chainguard-forks/ingress-nginx.git
        ref: controller-v1.15.16
      context: images/nginx/rootfs
      # No build-args needed: the inner Dockerfile uses a fixed FROM alpine:3.23.3
    tag:
      - "v2.2.26-chainguard"
    destinations:
      - registry.sighup.io/fury/ingress-nginx/nginx

  - name: nginx ingress controller v1.15.16 [Chainguard fork]
    source: ingress-nginx-chainguard-controller-v1.15.16
    multi-arch: true
    build:
      git_source:
        repo: https://github.com/chainguard-forks/ingress-nginx.git
        ref: controller-v1.15.16
      pre_build_commands:
        - "make build ARCH=amd64 TAG=v1.15.16"
        - "make build ARCH=arm64 TAG=v1.15.16"
        - "docker run --rm -v $(pwd):/work alpine chown -R $(id -u):$(id -g) /work"
      context: rootfs
      args:
        - name: BASE_IMAGE
          value: "registry.sighup.io/fury/ingress-nginx/nginx:v2.2.13-chainguard"
        - name: VERSION
          value: "v1.15.16"
    tag:
      - "v1.15.16-chainguard"
    destinations:
      - registry.sighup.io/fury/ingress-nginx/controller

  - name: nginx base image v1.15.16 [Chainguard fork]
    source: ingress-nginx-chainguard-nginx-v1.15.16
    multi-arch: true
    build:
      git_source:
        repo: https://github.com/chainguard-forks/ingress-nginx.git
        ref: controller-v1.15.16
      context: images/nginx/rootfs
      # No build-args needed: the inner Dockerfile uses a fixed FROM alpine:3.23.3
    tag:
      - "v2.2.26-chainguard"
    destinations:
      - registry.sighup.io/fury/ingress-nginx/nginx

  - name: nginx ingress controller v1.15.16 [Chainguard fork]
    source: ingress-nginx-chainguard-controller-v1.15.16
    multi-arch: true
    build:
      git_source:
        repo: https://github.com/chainguard-forks/ingress-nginx.git
        ref: controller-v1.15.16
      pre_build_commands:
        - "make build ARCH=amd64 TAG=v1.15.16"
        - "make build ARCH=arm64 TAG=v1.15.16"
        - "docker run --rm -v $(pwd):/work alpine chown -R $(id -u):$(id -g) /work"
      context: rootfs
      args:
        - name: BASE_IMAGE
          value: "registry.sighup.io/fury/ingress-nginx/nginx:v2.2.13-chainguard"
        - name: VERSION
          value: "v1.15.16"
    tag:
      - "v1.15.16-chainguard"
    destinations:
      - registry.sighup.io/fury/ingress-nginx/controller

  - name: MinIO RELEASE.2026-11-16T00-11-40Z [Chainguard fork]
    source: minio-chainguard-fork-20261116
    multi-arch: true
    build:
      git_source:
        repo: https://github.com/chainguard-forks/minio.git
        ref: RELEASE.2026-11-16T00-11-40Z
      # Dockerfile.dev is self-contained since RELEASE.2026-09-21T00-15-41Z
      # (runtime base cgr.dev/chainguard/wolfi-base, no longer minio/minio).
      # The -wolfi suffix tells these images apart from the older -chainguard
      # ones, built on the minio/minio base.
      dockerfile: Dockerfile.dev
      context: .
    tag:
      - "RELEASE.2026-11-16T00-11-40Z-chainguard-wolfi"
    destinations:
      - registry.sighup.io/fury/minio
